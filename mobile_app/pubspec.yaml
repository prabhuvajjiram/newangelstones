name: angel_granites_app
description: Mobile app for Angel Granites.
version: 4.2.0+33 # versionName + versionCode


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0 
  http: ^1.4.2
  # Storage solution changed to flutter_secure_storage
  flutter_secure_storage: ^10.0.0  # Alternative storage solution
  url_launcher: ^6.3.2
  intl: ^0.20.2
  provider: ^6.1.1
  flutter_native_splash: ^2.4.6
  pdfrx: ^2.4.4  # PDF viewer using modern native-assets integration
  path_provider: ^2.1.5
  
  # Explicitly allow newer transitive dependencies for future-proofing
  path: ^1.9.1
  sqflite: ^2.4.2
  connectivity_plus: ^7.0.0

  # Keep FlutterFire on one coordinated release. Do not use caret constraints
  # here because independently upgraded plugins can break shared core APIs.
  firebase_core: 4.12.1
  firebase_auth: 6.5.6
  cloud_firestore: 6.7.1
  firebase_messaging: 16.4.3
  firebase_crashlytics: 5.2.6
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0

  collection: any
  cached_network_image: ^3.4.1  # High-performance image caching
  share_plus: ^13.2.0  # Share functionality
  webview_flutter: ^4.10.0  # In-app browser for payment pages
  webview_flutter_android: ^4.0.0  # Android-specific WebView implementation
  webview_flutter_wkwebview: ^3.13.0  # iOS-specific WebView implementation
  flutter_typeahead: ^6.0.0  # Search autocomplete
  package_info_plus: ^10.2.0  # App version info

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0  # Latest stable version
  flutter_launcher_icons: ^0.14.4
  # Flutter's documented Microsoft Store packaging path.
  msix: ^3.18.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  image_path_android: "design/app-icons/angel-granites-fallback.png"
  image_path_ios: "design/app-icons/angel-granites-fallback.png"
  image_path_ios_dark_transparent: "design/app-icons/angel-granites-foreground.png"
  image_path_ios_tinted_grayscale: "design/app-icons/angel-granites-monochrome.png"
  adaptive_icon_background: "#0B0B09"
  adaptive_icon_foreground: "design/app-icons/angel-granites-foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "design/app-icons/angel-granites-monochrome.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0B0B09"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    # The wing mark remains legible in Windows taskbar and Start menu sizes.
    image_path: "design/app-icons/angel-granites-fallback.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

# Values must match Partner Center > Product identity exactly. The Store signs
# this unsigned package after certification.
msix_config:
  display_name: Angel Granites
  publisher_display_name: Angel Stones
  identity_name: AngelStones.AngelGranites
  publisher: CN=A2F5AA89-FCBF-4A75-9905-C57DA605A1BD
  logo_path: design/app-icons/angel-granites-fallback.png
  capabilities: internetClient
  languages: en-us
  architecture: x64
  os_min_version: 10.0.17763.0
  output_name: AngelGranites-windows-x64-store
  store: true

flutter_native_splash:
  color: "#121212"
  image: assets/splash_logo.png
  android: true
  ios: true
  web: true
  color_dark: "#121212"
  image_dark: assets/splash_logo.png
  # Centered logo display
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  # Android 12+ - simple centered logo only
  android_12:
    image: assets/splash_logo.png
    icon_background_color: "#121212"
    image_dark: assets/splash_logo.png

flutter:
  # Keep CocoaPods as the dependency manager until the complete native plugin
  # set has been verified with Flutter's Swift Package Manager integration.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/colors/
    - assets/pdfs/specials/
    - assets/products/
    - assets/products/benches/
    - assets/products/monuments/
    - assets/products/designs/
    - assets/products/MBNA_2025/
    - assets/products/columbarium/
    - assets/icon/
    - assets/logo.png
    - assets/featured_products.json
    - assets/inventory.json
    - assets/colors.json
    - assets/specials.json
    - assets/color_asset_mapping.json
    - assets/fonts/
    - assets/product_manifest.json
    - assets/pdf_manifest.json
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
